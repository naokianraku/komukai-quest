name: KomukaiQuest
options:
  bundleIdPrefix: com.anraku
  developmentLanguage: ja
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.4"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: Y5GK3529Q4
    CODE_SIGN_STYLE: Automatic
    # iPhone だけ。省略すると iPad も対象の universal になり、審査に iPad の
    # スクリーンショットが要るうえ、触っていない4:3の画面で審査されることになる。
    TARGETED_DEVICE_FAMILY: "1"

targets:
  KomukaiQuest:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      # ゲーム本体。青フォルダ（type: folder）でそのままアプリへ入れる。
      # リポジトリの置き方のまま入るので、game3d から ../../game/src/... への
      # 相対の読み込みがアプリの中でもそのまま通る。
      - path: ../game3d
        type: folder
        buildPhase: resources
      - path: ../game
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 小向クエスト
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        # 16:9 の横画面のゲーム。縦は持たせない（Webの縦持ち回転は使わない）
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false

  # 本物のタップでゲームが動くかを確かめる。canvas の中は見えないので、
  # アプリ側（-uitest 1）が JavaScript で覗いた結果を読んで判定する。
  KomukaiQuestUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: KomukaiQuest

schemes:
  KomukaiQuest:
    build:
      targets:
        KomukaiQuest: all
        KomukaiQuestUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KomukaiQuestUITests
